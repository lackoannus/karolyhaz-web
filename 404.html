<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Károlyház Kft. - A keresett oldal nem található"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Oldal nem található | Károlyház Kft.</title>
  </head>
  <body>
    <!-- FEJLÉC (Ide másold be a pontos, végleges fejlécedet az index.html-ből!) -->
    <header class="fejlec">
      <!-- ... -->
    </header>

    <!-- 404 TARTALOM (Középre zárt, elegáns hibaoldal) -->
    <section
      class="hiba-szekcio"
      style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 var(--oldal-padding);
        background-color: var(--szin-sotet);
      "
    >
      <!-- Hatalmas arany 404-es felirat -->
      <h1
        style="
          font-size: clamp(6rem, 15vw, 12rem);
          color: var(--szin-kiemeles);
          line-height: 1;
          margin-bottom: 1rem;
          font-family: monospace;
        "
      >
        404
      </h1>

      <h2
        style="
          font-size: clamp(1.5rem, 4vw, 2.5rem);
          color: var(--szin-feher);
          margin-bottom: 1.5rem;
          text-transform: uppercase;
          letter-spacing: 2px;
        "
      >
        Itt valami összedőlt!
      </h2>

      <p
        style="
          color: var(--szin-szoveg);
          font-size: 1.1rem;
          max-width: 600px;
          line-height: 1.6;
          margin-bottom: 3rem;
        "
      >
        Lehet, hogy elgépelted a webcímet, vagy az oldal, amit keresel időközben
        áthelyezésre került. Ne aggódj, a főoldalról mindent újra megtalálsz!
      </p>

      <!-- Vissza a főoldalra gomb (a meglévő .gomb stílusodat használja) -->
      <a
        href="index.html"
        class="gomb"
        style="font-size: 1.1rem; padding: 1rem 3rem"
        >Vissza a főoldalra</a
      >
    </section>

    <!-- LÁBLÉC (Ide másold be a pontos láblécedet!) -->
    <footer id="kapcsolat" class="lablec">
      <!-- ... -->
    </footer>
  </body>
</html>
